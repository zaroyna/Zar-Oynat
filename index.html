<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hileli İki Kişilik Zar Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎲 Düello Zar Oyunu</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="gameMode">Oyun Modu:</label>
                <select id="gameMode">
                    <option value="normal">Normal Mod (Tek Oyuncu)</option>
                    <option value="rigged" selected>İki Oyuncu (2. Oyuncu Kazanır!)</option>
                </select>
            </div>
            
            <button id="rollBtn">Zarları At!</button>
        </div>

        <!-- Oyuncu Alanları -->
        <div class="players-area">
            <div class="player-box">
                <h3>1. Oyuncu</h3>
                <div id="player1Dice" class="dice">?</div>
            </div>
            <div class="player-box">
                <h3>2. Oyuncu (Şanslı)</h3>
                <div id="player2Dice" class="dice">?</div>
            </div>
        </div>

        <div id="winnerText" class="winner-text"></div>

        <div class="history-container">
            <h3>Geçmiş Maçlar</h3>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
