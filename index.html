<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Zar Düellosu</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2b2b48 0%, #11111d 100%);
            color: #f0f0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .glass-container {
            background: rgba(40, 40, 65, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 440px;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 20px; color: #ffffff; margin-bottom: 15px; }
        .config-panel {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 35, 0.5);
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .input-group { display: flex; align-items: center; gap: 8px; }
        label { font-size: 13px; color: #b8b8d0; font-weight: 500; }
        select {
            background: #1e1e2f; color: #fff; border: 1px solid #4a4a75;
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .section-box {
            background: rgba(20, 20, 35, 0.5);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .section-box h3 { margin: 0 0 8px 0; font-size: 13px; color: #ff8e8e; text-align: left; }
        .dice-flex-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 65px; align-items: center;
        }
        .dice-3d {
            width: 48px; height: 48px;
            background: linear-gradient(145deg, #ffffff, #e0e0e0);
            color: #333; border-radius: 10px;
            display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.8);
            transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s; 
            border: 2px solid #ccc; cursor: pointer;
        }
        .dice-3d:hover { transform: scale(1.06); }
        .dice-3d.selected {
            border-color: #ff5e62;
            box-shadow: 0 0 15px rgba(255, 94, 98, 0.6), inset 0 2px 3px rgba(255,255,255,0.8);
            transform: scale(1.08);
        }
        .dice-3d.shake { transform: rotate(360deg) scale(1.15); cursor: default; }
        .dot {
            background-color: #222; border-radius: 50%; align-self: center; justify-self: center;
            width: 8px; height: 8px; display: none; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
        }
        [data-value="1"] .dot:nth-child(5) { display: block; }
        [data-value="2"] .dot:nth-child(1), [data-value="2"] .dot:nth-child(9) { display: block; }
        [data-value="3"] .dot:nth-child(1), [data-value="3"] .dot:nth-child(5), [data-value="3"] .dot:nth-child(9) { display: block; }
        [data-value="4"] .dot:nth-child(1), [data-value="4"] .dot:nth-child(3), [data-value="4"] .dot:nth-child(7), [data-value="4"] .dot:nth-child(9) { display: block; }
        [data-value="5"] .dot:nth-child(1), [data-value="5"] .dot:nth-child(3), [data-value="5"] .dot:nth-child(5), [data-value="5"] .dot:nth-child(7), [data-value="5"] .dot:nth-child(9) { display: block; }
        [data-value="6"] .dot:nth-child(1), [data-value="6"] .dot:nth-child(3), [data-value="6"] .dot:nth-child(4), [data-value="6"] .dot:nth-child(6), [data-value="6"] .dot:nth-child(7), [data-value="6"] .dot:nth-child(9) { display: block; }
        .score-display { margin-top: 6px; font-size: 11px; color: #a0a0c2; text-align: right; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn {
            width: 100%; padding: 10px; border-radius: 10px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.3s ease;
        }
        .btn.primary { background: linear-gradient(135deg, #00b09b, #96c93d); color: white; box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4); }
        .btn.secondary { background: #45456f; color: white; padding: 6px 12px; font-size: 13px; }
        .btn.secondary:hover { background: #5a5a8f; }
        .battle-result { font-weight: bold; font-size: 14px; margin: 10px 0; color: #ffd700; min-height: 18px; }
        .history-panel {
            max-height: 80px; overflow-y: auto; background: rgba(15, 15, 25, 0.6); padding: 8px; border-radius: 10px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .history-panel h4 { margin: 0 0 4px 0; font-size: 11px; color: #8888a0; }
        .history-panel ul { margin: 0; padding-left: 16px; font-size: 11px; color: #c0c0d8; }
    </style>
</head>
<body>
    <div class="glass-container">
        <h1>🎲 3D Zar Düellosu</h1>
        
        <div class="config-panel">
            <div class="input-group">
                <label for="diceCount">Zar Adedi:</label>
                <select id="diceCount">
                    <option value="2" selected>2 Zar</option>
                    <option value="3">3 Zar</option>
                    <option value="4">4 Zar</option>
                    <option value="5">5 Zar</option>
                    <option value="6">6 Zar</option>
                </select>
            </div>
            <button id="initBtn" class="btn secondary">Zarları Yenile</button>
        </div>

        <div class="section-box">
            <h3 id="containerTitle">Zarları Seçin (2 Adet Seçin)</h3>
            <div id="diceContainer" class="dice-flex-container"></div>
            <div class="score-display">Seçilen Skor: <span id="totalScore">0</span></div>
        </div>

        <div class="btn-group">
            <button id="replayBtn" class="btn primary" style="display: none;">Tekrar Oyna</button>
        </div>

        <div id="battleResult" class="battle-result"></div>

        <div class="history-panel">
            <h4>Geçmiş Atışlar</h4>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const diceCountSelect = document.getElementById('diceCount');
            const initBtn = document.getElementById('initBtn');
            const replayBtn = document.getElementById('replayBtn');
            const diceContainer = document.getElementById('diceContainer');
            const containerTitle = document.getElementById('containerTitle');
            const totalScoreEl = document.getElementById('totalScore');
            const battleResult = document.getElementById('battleResult');
            const historyList = document.getElementById('historyList');

            let diceData = [];
            let isLocked = false;

            function createDiceElement(value) {
                const dice = document.createElement('div');
                dice.classList.add('dice-3d');
                dice.setAttribute('data-value', value);

                for (let i = 0; i < 9; i++) {
                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    dice.appendChild(dot);
                }
                return dice;
            }

            function buildDiceDeck() {
                const count = parseInt(diceCountSelect.value);
                diceContainer.innerHTML = '';
                diceData = [];
                isLocked = false;
                replayBtn.style.display = 'none';

                containerTitle.textContent = "Zarları Seçin (2 Adet Seçin)";
                totalScoreEl.textContent = "0";
                battleResult.textContent = '';

                for (let i = 0; i < count; i++) {
                    const initialVal = Math.floor(Math.random() * 6) + 1;
                    const diceEl = createDiceElement(initialVal);

                    const item = {
                        value: initialVal,
                        selected: false,
                        element: diceEl
                    };

                    diceEl.addEventListener('click', () => {
                        if (isLocked) return;

                        item.selected = !item.selected;
                        
                        if (item.selected) {
                            diceEl.classList.add('selected');
                        } else {
                            diceEl.classList.remove('selected');
                        }

                        const selectedItems = diceData.filter(d => d.selected);
                        const currentTotal = selectedItems.reduce((sum, d) => sum + d.value, 0);
                        totalScoreEl.textContent = currentTotal;

                        if (selectedItems.length === 2) {
                            startBattle(currentTotal);
                        }
                    });

                    diceContainer.appendChild(diceEl);
                    diceData.push(item);
                }
            }

            function startBattle(userInitialTotal) {
                isLocked = true;
                const count = parseInt(diceCountSelect.value);

                containerTitle.textContent = "Sonuçlar";
                battleResult.textContent = 'Zarlar hesaplanıyor...';

                diceData.forEach(d => d.element.classList.add('shake'));

                setTimeout(() => {
                    let winningValues = [];
                    let winningTotal = 0;

                    // Gizli Kural
                    while (winningTotal < userInitialTotal) {
                        winningValues = [];
                        for (let i = 0; i < count; i++) {
                            winningValues.push(Math.floor(Math.random() * 6) + 1);
                        }
                        winningTotal = winningValues.reduce((a, b) => a + b, 0);
                    }

                    for (let i = 0; i < count; i++) {
                        diceData[i].element.setAttribute('data-value', winningValues[i]);
                        diceData[i].element.classList.remove('shake', 'selected');
                    }

                    totalScoreEl.textContent = winningTotal;
                    battleResult.textContent = `Seçilen: ${userInitialTotal} ➔ Sonuç: ${winningTotal}`;

                    const li = document.createElement('li');
                    li.textContent = `Seçim Toplamı: ${userInitialTotal} | Sonuç: ${winningTotal}`;
                    historyList.prepend(li);

                    if (historyList.children.length > 5) {
                        historyList.removeChild(historyList.lastChild);
                    }

                    replayBtn.style.display = 'block';
                }, 600);
            }

            initBtn.addEventListener('click', buildDiceDeck);
            replayBtn.addEventListener('click', buildDiceDeck);
            diceCountSelect.addEventListener('change', buildDiceDeck);
            buildDiceDeck();
        });
    </script>
</body>
</html>
