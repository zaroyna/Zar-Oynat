<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Zar Düellosu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1>🎲 Taktiksel Zar Düellosu</h1>
        
        <div class="config-panel">
            <div class="input-group">
                <label for="diceCount">Zar Adedi:</label>
                <select id="diceCount">
                    <option value="1">1 Zar</option>
                    <option value="2">2 Zar</option>
                    <option value="3">3 Zar</option>
                    <option value="4">4 Zar</option>
                    <option value="5">5 Zar</option>
                    <option value="6" selected>6 Zar</option>
                </select>
            </div>
            <button id="initBtn" class="btn secondary">Zarları Oluştur</button>
        </div>

        <!-- 1. Seçim (Kullanıcı Tarafından Manuel Belirlenir) -->
        <div class="section-box">
            <h3>1. Seçiminiz (Kendi Zarlarınızı Belirleyin)</h3>
            <div id="userDiceContainer" class="dice-grid"></div>
            <div class="score-display">Toplam Skor: <span id="userScore">0</span></div>
        </div>

        <!-- 2. Seçim (Sistem Karşılığı) -->
        <div class="section-box">
            <h3>2. Seçim (Rakip Zarlar)</h3>
            <div id="rivalDiceContainer" class="dice-grid"></div>
            <div class="score-display">Toplam Skor: <span id="rivalScore">0</span></div>
        </div>

        <button id="rollBtn" class="btn primary" disabled>Mücadeleyi Başlat!</button>

        <div id="battleResult" class="battle-result"></div>

        <div class="history-panel">
            <h4>Mücadele Geçmişi</h4>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
